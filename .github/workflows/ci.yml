name: CI

# ADR-0050 §10/§11: CI runs the canonical `make check` (lint + hermetic tests +
# repo/clean/prompt validation) on every push to main and every PR. The suite
# needs no network or credentials. Least-privilege by default; third-party
# actions pinned to full commit SHAs (version in comment) so a moved tag cannot
# change what runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: make check
        run: make check
