name: CI

# ADR-0050 §10/§11: CI runs the canonical `make check` (lint + hermetic tests +
# repo/clean/prompt validation) on every push to main and every PR. The suite
# needs no network or credentials. Least-privilege by default; third-party
# actions pinned to full commit SHAs (version in comment) so a moved tag cannot
# change what runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: make check
        run: make check
